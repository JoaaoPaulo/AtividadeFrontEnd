<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 05 - Convidados VIP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            width: 450px;
        }
        h1 {
            font-size: 1.4em;
            margin-bottom: 20px;
            text-align: center;
        }
        .entrada {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 9px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button.btn-adicionar {
            padding: 9px 16px;
            font-size: 1em;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 5px;
            border-bottom: 1px solid #eee;
        }
        li:last-child {
            border-bottom: none;
        }
        .nome {
            flex: 1;
            font-size: 1em;
        }
        .nome.riscado {
            text-decoration: line-through;
            color: #aaa;
        }
        .acoes {
            display: flex;
            gap: 6px;
        }
        .acoes button {
            padding: 5px 10px;
            font-size: 0.85em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-concluir { background: #1abc9c; color: white; }
        .btn-editar   { background: #f39c12; color: white; }
        .btn-excluir  { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>Infinity Bank - Lista de Convidados VIP</h1>

    <div class="entrada">
        <input type="text" id="nomeInput" placeholder="Nome do convidado">
        <button class="btn-adicionar" onclick="adicionar()">Adicionar</button>
    </div>

    <ul id="lista"></ul>
</div>

<script>
    function adicionar() {
        var input = document.getElementById("nomeInput");
        var nome = input.value.trim();

        if (nome === "") {
            alert("Digite um nome!");
            return;
        }

        var lista = document.getElementById("lista");

        var li = document.createElement("li");

        var spanNome = document.createElement("span");
        spanNome.className = "nome";
        spanNome.innerText = nome;

        var divAcoes = document.createElement("div");
        divAcoes.className = "acoes";

        var btnConcluir = document.createElement("button");
        btnConcluir.className = "btn-concluir";
        btnConcluir.innerText = "Concluir";
        btnConcluir.addEventListener("click", function() {
            spanNome.classList.toggle("riscado");
        });

        var btnEditar = document.createElement("button");
        btnEditar.className = "btn-editar";
        btnEditar.innerText = "Editar";
        btnEditar.addEventListener("click", function() {
            var novoNome = prompt("Novo nome:", spanNome.innerText);
            if (novoNome !== null && novoNome.trim() !== "") {
                spanNome.innerText = novoNome.trim();
            }
        });

        var btnExcluir = document.createElement("button");
        btnExcluir.className = "btn-excluir";
        btnExcluir.innerText = "Excluir";
        btnExcluir.addEventListener("click", function() {
            lista.removeChild(li);
        });

        divAcoes.appendChild(btnConcluir);
        divAcoes.appendChild(btnEditar);
        divAcoes.appendChild(btnExcluir);

        li.appendChild(spanNome);
        li.appendChild(divAcoes);
        lista.appendChild(li);

        input.value = "";
        input.focus();
    }

    // permite pressionar Enter para adicionar
    document.getElementById("nomeInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") adicionar();
    });
</script>

</body>
</html>
